<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="kf-og-title kf-og-desc">
  <title id="kf-og-title">KindleForge — 把任何文件，变成 Kindle 上最好读的那本书</title>
  <desc id="kf-og-desc">深墨底、苔绿强调。左侧是品牌主张与格式说明，右侧是 Kindle Paperwhite 线稿，屏幕上是一页认真排过版的正文。</desc>

  <defs>
    <radialGradient id="kf-og-glow" cx="18%" cy="-8%" r="72%">
      <stop offset="0" stop-color="#a8f06a" stop-opacity="0.12" />
      <stop offset="0.55" stop-color="#a8f06a" stop-opacity="0.03" />
      <stop offset="1" stop-color="#a8f06a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="kf-og-device-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a8f06a" stop-opacity="0.16" />
      <stop offset="1" stop-color="#a8f06a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="kf-og-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b09" stop-opacity="0" />
      <stop offset="1" stop-color="#070b09" stop-opacity="0.72" />
    </linearGradient>
    <pattern id="kf-og-grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#f4f0e6" stroke-opacity="0.045" />
    </pattern>
    <filter id="kf-og-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <!-- ground -->
  <rect width="1200" height="630" fill="#070b09" />
  <rect width="1200" height="630" fill="url(#kf-og-glow)" />
  <rect width="1200" height="630" fill="url(#kf-og-grid)" />
  <rect y="420" width="1200" height="210" fill="url(#kf-og-fade)" />

  <!-- print crop ticks -->
  <g stroke="#f4f0e6" stroke-opacity="0.18" stroke-width="1">
    <path d="M40 40h22M40 40v22" fill="none" />
    <path d="M1160 40h-22M1160 40v22" fill="none" />
    <path d="M40 590h22M40 590v-22" fill="none" />
    <path d="M1160 590h-22M1160 590v-22" fill="none" />
  </g>

  <!-- brand lockup (scaled from public/brand/logo.svg) -->
  <g transform="translate(72 46) scale(0.7)" color="#f4f0e6">
    <g transform="translate(6 10.5) scale(1.34)" fill="none" stroke="currentColor" stroke-width="3.1" stroke-linecap="round">
      <path d="M9.2 5.2v21.6" />
      <path d="M9.2 16.1c4.4-1 9.9-4.6 13.6-10.1" />
      <path d="M9.2 16.1c4.8 1.2 10.3 5.2 14.6 10.4" />
    </g>
    <path
      d="M41.64 12.64l1.34 3.35 3.35 1.34-3.35 1.34-1.34 3.35-1.34-3.35-3.35-1.34 3.35-1.34z"
      fill="#a8f06a"
    />
    <text
      x="56"
      y="42.5"
      font-family="'Source Han Serif SC', 'Noto Serif SC', 'Songti SC', Georgia, 'Times New Roman', serif"
      font-size="29"
      font-weight="600"
      letter-spacing="-0.4"
    >
      <tspan fill="#f4f0e6">Kindle</tspan><tspan fill="#a8f06a">Forge</tspan>
    </text>
  </g>

  <!-- eyebrow -->
  <g
    font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace"
    font-size="14"
    letter-spacing="3.1"
    fill="#a8f06a"
  >
    <text x="72" y="146">本地优先 · 零上传 · 开源可自托管</text>
  </g>

  <!-- headline -->
  <g
    font-family="'Source Han Serif SC', 'Noto Serif SC', 'Songti SC', Georgia, 'Times New Roman', serif"
    font-size="62"
    font-weight="600"
    letter-spacing="-1.4"
    fill="#f4f0e6"
  >
    <text x="70" y="234">把任何文件，</text>
    <text x="70" y="308">变成 Kindle 上</text>
    <text x="70" y="382">最好读的那本书。</text>
  </g>
  <path d="M74 400c64-7 132-9 208-7 80 2 152 6 226 9" fill="none" stroke="#a8f06a" stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round" />

  <!-- subline -->
  <text x="72" y="446" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', sans-serif" font-size="20" fill="#d9d3c4">
    EPUB · MOBI · AZW3 · PDF · DOCX · TXT · CBZ 互转，Kindle 专属排版
  </text>

  <!-- trust chips -->
  <g font-family="'Inter', 'Noto Sans SC', 'PingFang SC', sans-serif" font-size="14" fill="#d9d3c4">
    <g>
      <rect x="72" y="492" width="196" height="36" rx="18" fill="none" stroke="#f4f0e6" stroke-opacity="0.16" />
      <circle cx="92" cy="510" r="3" fill="#a8f06a" />
      <text x="104" y="515">15 类输入 · 7 类输出</text>
    </g>
    <g>
      <rect x="280" y="492" width="282" height="36" rx="18" fill="none" stroke="#f4f0e6" stroke-opacity="0.16" />
      <circle cx="300" cy="510" r="3" fill="#a8f06a" />
      <text x="312" y="515">纯文本格式本地转换 · 0 上传</text>
    </g>
    <g>
      <rect x="574" y="492" width="176" height="36" rx="18" fill="none" stroke="#f4f0e6" stroke-opacity="0.16" />
      <circle cx="594" cy="510" r="3" fill="#a8f06a" />
      <text x="606" y="515">开源 · 可自托管</text>
    </g>
  </g>

  <!-- Paperwhite line art -->
  <ellipse cx="968" cy="322" rx="190" ry="210" fill="url(#kf-og-device-glow)" />
  <g>
    <rect x="852" y="148" width="232" height="322" rx="20" fill="#0c1210" stroke="#f4f0e6" stroke-opacity="0.5" stroke-width="1.5" />
    <rect x="858" y="154" width="220" height="310" rx="16" fill="none" stroke="#f4f0e6" stroke-opacity="0.08" />
    <path d="M855 210v70" stroke="#f4f0e6" stroke-opacity="0.16" stroke-linecap="round" />
    <rect x="864" y="162" width="208" height="286" rx="8" fill="#f4f0e6" />
    <rect x="864" y="162" width="208" height="286" rx="8" fill="none" stroke="#18211d" stroke-opacity="0.14" />

    <!-- screen content: a well-set page -->
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8" letter-spacing="1.4" fill="#5a9c2e">
      <text x="886" y="192">CHAPTER ONE</text>
    </g>
    <g font-family="'Source Han Serif SC', 'Noto Serif SC', 'Songti SC', Georgia, serif" font-size="20" font-weight="600" fill="#18211d">
      <text x="886" y="226">夜读笔记</text>
    </g>
    <path d="M886 240h164" stroke="#18211d" stroke-opacity="0.16" />
    <g fill="#243029" fill-opacity="0.52">
      <rect x="886" y="262" width="162" height="5" rx="2.5" />
      <rect x="886" y="278" width="150" height="5" rx="2.5" />
      <rect x="886" y="294" width="164" height="5" rx="2.5" />
      <rect x="886" y="310" width="118" height="5" rx="2.5" />
      <rect x="886" y="334" width="164" height="5" rx="2.5" />
      <rect x="886" y="350" width="156" height="5" rx="2.5" />
      <rect x="886" y="366" width="96" height="5" rx="2.5" />
    </g>
    <rect x="886" y="414" width="164" height="3" rx="1.5" fill="#18211d" fill-opacity="0.12" />
    <rect x="886" y="414" width="98" height="3" rx="1.5" fill="#5a9c2e" />
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#18211d" fill-opacity="0.55">
      <text x="968" y="433" text-anchor="middle">128</text>
    </g>
    <g font-family="'Inter', 'Noto Sans SC', sans-serif" font-size="10" letter-spacing="2.4" fill="#f4f0e6" fill-opacity="0.55">
      <text x="968" y="461" text-anchor="middle">kindle</text>
    </g>
  </g>

  <!-- footer note -->
  <text
    x="1128"
    y="596"
    text-anchor="end"
    font-family="ui-monospace, 'SF Mono', Menlo, monospace"
    font-size="13"
    letter-spacing="0.6"
    fill="#9d9789"
  >kindleforge.app — 本地优先的电子书转换器</text>

  <!-- grain -->
  <rect width="1200" height="630" filter="url(#kf-og-grain)" opacity="0.05" style="mix-blend-mode:overlay" />
</svg>
