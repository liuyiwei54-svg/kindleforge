<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 460" width="360" height="460" role="img" aria-labelledby="kf-pw-title kf-pw-desc" color="#f4f0e6">
  <title id="kf-pw-title">Kindle Paperwhite front view</title>
  <desc id="kf-pw-desc">Line drawing of a Kindle Paperwhite with a typeset page on its e-ink screen: chapter label, serif heading, justified text lines, page number and reading progress.</desc>

  <!-- device body -->
  <rect x="52" y="24" width="256" height="362" rx="26" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5" />
  <rect x="58" y="30" width="244" height="350" rx="21" fill="none" stroke="currentColor" stroke-opacity="0.12" stroke-width="1" />

  <!-- e-ink screen -->
  <rect x="70" y="54" width="220" height="294" rx="7" fill="currentColor" fill-opacity="0.035" stroke="currentColor" stroke-opacity="0.22" />

  <!-- screen: a well-set page -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="7.5" letter-spacing="1.6" fill="#a8f06a" fill-opacity="0.85">
    <text x="92" y="96">CHAPTER TWO</text>
  </g>
  <g font-family="'Source Han Serif SC', 'Noto Serif SC', 'Songti SC', Georgia, serif" font-size="17" font-weight="600" fill="currentColor" fill-opacity="0.88">
    <text x="92" y="129">夜航西飞</text>
  </g>
  <path d="M92 146h176" stroke="currentColor" stroke-opacity="0.16" />

  <g fill="currentColor" fill-opacity="0.22">
    <rect x="92" y="170" width="176" height="5" rx="2.5" />
    <rect x="92" y="188" width="162" height="5" rx="2.5" />
    <rect x="92" y="206" width="176" height="5" rx="2.5" />
    <rect x="92" y="224" width="138" height="5" rx="2.5" />
    <rect x="92" y="242" width="176" height="5" rx="2.5" />
    <rect x="92" y="260" width="108" height="5" rx="2.5" />
  </g>

  <!-- reading progress + folio -->
  <rect x="106" y="301" width="148" height="3" rx="1.5" fill="currentColor" fill-opacity="0.12" />
  <rect x="106" y="301" width="58" height="3" rx="1.5" fill="#a8f06a" fill-opacity="0.8" />
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8" fill="currentColor" fill-opacity="0.4">
    <text x="180" y="324" text-anchor="middle">042</text>
  </g>

  <!-- bezel wordmark + power light -->
  <g font-family="'Inter', 'Noto Sans SC', sans-serif" font-size="9" letter-spacing="2.6" fill="currentColor" fill-opacity="0.35">
    <text x="180" y="372" text-anchor="middle">kindle</text>
  </g>
</svg>
